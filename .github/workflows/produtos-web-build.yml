name: produtos-web - build

on:
  push:
    branches: [main]
    paths:
      - "produtos-web/**"
      - ".github/workflows/produtos-web-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: produtos-web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
      - name: Instalar dependências
        run: npm install
      - name: Build de produção
        run: npm run build
