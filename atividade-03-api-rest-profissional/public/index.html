<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini-Prontuário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <p class="app-header__eyebrow">IFPI · Programação para Internet II · Atividade C</p>
      <h1 class="app-header__title">Mini-Prontuário</h1>
    </div>
  </header>

  <main class="container app-main">
    <div id="form-error-container"></div>

    <section class="patient-create mb-4" aria-label="Cadastrar paciente">
      <h2 class="h5">Novo paciente</h2>
      <form id="patient-form" class="row g-2">
        <div class="col-12 col-md-4">
          <label class="form-label" for="patient-name">Nome</label>
          <input id="patient-name" class="form-control" name="name" />
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label" for="patient-birth-date">Nascimento</label>
          <input id="patient-birth-date" class="form-control" name="birthDate" type="date" />
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label" for="patient-national-id">CNS</label>
          <input id="patient-national-id" class="form-control" name="nationalId" />
        </div>
        <div class="col-12 col-md-2 d-flex align-items-end">
          <button class="btn btn-success w-100" type="submit">Cadastrar</button>
        </div>
      </form>
    </section>

    <div id="list-view">
      <section class="toolbar" aria-label="Filtros da lista de pacientes">
        <div class="toolbar__search">
          <label class="form-label" for="search-input">Buscar paciente</label>
          <input id="search-input" class="form-control form-control-lg" type="search" placeholder="Digite parte do nome…" autocomplete="off" />
        </div>
        <div class="toolbar__filter form-check form-switch">
          <input class="form-check-input" type="checkbox" id="only-active-input" />
          <label class="form-check-label" for="only-active-input">Mostrar apenas pacientes ativos</label>
        </div>
      </section>

      <p id="result-counter" class="result-counter" aria-live="polite"></p>
      <ul id="patient-list" class="patient-list"></ul>
    </div>

    <section id="detail-view" hidden></section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
